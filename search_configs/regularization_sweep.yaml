# Focused grid over regularization-related parameters.
catboost:
  iterations: [300]
  depth: [5, 7]
  l2_leaf_reg: [1.0, 3.0, 7.0]
  bagging_temperature: [0.0, 0.5, 1.0]
  subsample: [0.7, 0.9]
transform:
  bins:
    usd_base_amount:
      - {min: 0, max: 1700, interval: 20}
      - {min: 0, max: 1700, interval: 40}
  outlier:
    num_offers: [{max: 12}, {max: 16}]
