# Wider search across depth, learning rate, and class weights.
catboost:
  iterations: [300, 600]
  depth: [5, 7, 9]
  learning_rate: [0.03, 0.06, 0.12]
  scale_pos_weight: [1.0, 1.5, 2.0]
  border_count: [128, 254]
transform:
  impute_median:
    seats_available: [false, true]
  outlier:
    item_count: [{max: 5}, {max: 6}, {max: 8}]
    num_offers: [{max: 12}, {max: 14}, {max: 16}]
  bins:
    seats_available:
      - {min: -1, max: 30, interval: 1}
      - {min: -1, max: 30, interval: 2}
    usd_base_amount:
      - {min: 0, max: 1700, interval: 10}
      - {min: 0, max: 1700, interval: 50}
